services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: gridpulse-db
    environment:
      POSTGRES_DB: gridpulse
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpulse} -d ${POSTGRES_DB:-gridpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gridpulse-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db          # container-to-container
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gridpulse}
      POSTGRES_USER: ${POSTGRES_USER:-gridpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro   # models read-only
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: gridpulse-dashboard
    ports:
      - "8501:8501"
    environment:
      GRIDPULSE_API_URL: http://api:8000/api/v1   # container-to-container
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata: