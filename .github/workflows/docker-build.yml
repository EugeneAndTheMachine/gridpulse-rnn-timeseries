name: docker-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/Dockerfile.api
          - name: dashboard
            dockerfile: infra/docker/Dockerfile.dashboard
          - name: train
            dockerfile: infra/docker/Dockerfile.train
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build placeholder image
        run: docker build -f ${{ matrix.dockerfile }} -t gridpulse-${{ matrix.name }}:ci .
